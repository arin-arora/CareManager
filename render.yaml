services:
  - type: web
    name: caremanager-backend-api
    env: node
    rootDir: backend-node
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run seed && npm start
    envVars:
      - key: PORT
        value: 5050
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: caremanager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://care-manager-sable.vercel.app

databases:
  - name: caremanager-db
    databaseName: caremanager
    user: caremanager_user
