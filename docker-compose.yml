version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: appointment-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: appointment_manager
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: appointment-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data

  backend-node:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: appointment-backend-node
    command: npm run dev
    ports:
      - "5051:5000"
    volumes:
      - ./backend-node:/app
      - /app/node_modules
    environment:
      - PORT=${PORT:-5000}
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/appointment_manager?schema=public
      - REDIS_URL=${REDIS_URL:-redis://appointment-redis:6379}
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtkey123!}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3002}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SMTP_FROM=${SMTP_FROM}
      - LLM_PROVIDER=${LLM_PROVIDER:-MOCK}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - STRICT_AI_MODE=${STRICT_AI_MODE:-false}
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: appointment-frontend
    ports:
      - "3002:3001"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5051
    depends_on:
      - backend-node

volumes:
  postgres-data:
  redis-data:
