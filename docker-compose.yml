version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: medguide-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: medguide
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: medguide-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend-node:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: medguide-backend-node
    command: npm run dev
    ports:
      - "5050:5000"
    volumes:
      - ./backend-node:/app
      - /app/node_modules
    environment:
      - PORT=${PORT:-5000}
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/medguide?schema=public
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtkey123!}
      - ML_SERVICE_URL=${ML_SERVICE_URL:-http://backend-python:8000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SMTP_FROM=${SMTP_FROM}
    depends_on:
      - postgres
      - redis

  backend-python:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: medguide-backend-python
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend-python:/app
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - STRICT_AI_MODE=${STRICT_AI_MODE:-true}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medguide-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5050
      - VITE_ML_API_URL=http://localhost:8000
    depends_on:
      - backend-node

volumes:
  postgres-data:
  redis-data:
